name: finpulse

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c "
      mongosh --host mongo --quiet --eval '
        try {
          rs.status();
          print(\"replica set already initialized\");
        } catch (e) {
          rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
          print(\"replica set initialized\");
        }
      '"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/finpulse?replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    command: ["node", "dist/pipeline/src/producer/index.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/finpulse?replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    command: ["node", "dist/pipeline/src/consumer/index.js"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/finpulse?replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
  kafka-data:
